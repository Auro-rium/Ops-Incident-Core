name: Deploy GPU RAG Models

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable runtime image tag. Defaults to this commit SHA.
        required: false
      deploy:
        description: Deploy Azure ML GPU endpoints after the image build.
        type: boolean
        default: false
      run_eval:
        description: Run the Azure benchmark job after deployment.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_ML_WORKSPACE: ${{ vars.AZURE_ML_WORKSPACE }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  BGE_M3_REVISION: ${{ vars.BGE_M3_REVISION }}
  BGE_RERANKER_REVISION: ${{ vars.BGE_RERANKER_REVISION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: azure-demo
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate Azure ML configuration
        run: |
          test -n "$AZURE_RESOURCE_GROUP"
          test -n "$AZURE_ML_WORKSPACE"
          test -n "$ACR_NAME"
          test -n "$BGE_M3_REVISION"
          test -n "$BGE_RERANKER_REVISION"
      - name: Build and push GPU runtime image
        run: bash scripts/azure_build_rag_runtime.sh
      - name: Deploy Azure ML endpoints
        if: ${{ inputs.deploy }}
        run: bash scripts/azure_deploy_rag_models.sh
      - name: Run cloud RAG evaluation
        if: ${{ inputs.run_eval }}
        run: bash scripts/azure_rag_eval.sh
