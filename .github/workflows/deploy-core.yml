name: Deploy IncidentOps Core

on:
  push:
    branches:
      - main
      - core
      - deploy
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || secrets.ECS_CLUSTER }}
  ECS_API_SERVICE: ${{ vars.ECS_API_SERVICE || secrets.ECS_API_SERVICE }}
  ECS_WORKER_SERVICE: ${{ vars.ECS_WORKER_SERVICE || secrets.ECS_WORKER_SERVICE }}
  ECS_API_TASK_DEFINITION: ${{ vars.ECS_API_TASK_DEFINITION || secrets.ECS_API_TASK_DEFINITION }}
  ECS_WORKER_TASK_DEFINITION: ${{ vars.ECS_WORKER_TASK_DEFINITION || secrets.ECS_WORKER_TASK_DEFINITION }}
  ECS_API_CONTAINER_NAME: ${{ vars.ECS_API_CONTAINER_NAME || 'api' }}
  ECS_WORKER_CONTAINER_NAME: ${{ vars.ECS_WORKER_CONTAINER_NAME || 'worker' }}
  API_BASE_URL: ${{ vars.API_BASE_URL || secrets.API_BASE_URL }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra dev ruff check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: incidentops
          POSTGRES_PASSWORD: incidentops
          POSTGRES_DB: incidentops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      APP_ENV: local
      DB_CREATE_ALL: "false"
      DB_REQUIRE_MIGRATIONS: "true"
      DATABASE_URL: postgresql+asyncpg://incidentops:incidentops@127.0.0.1:5432/incidentops
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET: incidentops-local-jwt-secret-change-me
      ALLOW_LOCAL_SEED_ADMIN: "true"
      DEMO_MODE_PUBLIC: "false"
      ALLOW_DEMO_PROJECT_BYPASS: "true"
      RATE_LIMIT_BACKEND: memory
      WORKER_MODE: inline
      JOB_QUEUE_BACKEND: inline
      METRICS_BACKEND: memory
      METRICS_PUBLIC: "false"
      LOCAL_INGEST_ENABLED: "true"
      LOCAL_INGEST_ALLOWED_ROOTS: ${{ github.workspace }},/tmp
      EVAL_CASES_ALLOWED_ROOTS: ${{ github.workspace }},/tmp
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra dev alembic upgrade head
      - name: Start local API
        run: |
          nohup uv run --extra dev uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > /tmp/incidentops-api.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/incidentops-api.log
          exit 1
      - run: uv run --extra dev python -m pytest tests/unit tests/integration -q

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs:
      - lint
      - tests
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

  deploy:
    name: Migrate and Deploy ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register API task definition revision
        id: api-task
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_API_TASK_DEFINITION" \
            --query taskDefinition > /tmp/api-task-definition.json
          python scripts/render_ecs_task_definition.py \
            --input /tmp/api-task-definition.json \
            --output /tmp/api-task-definition-rendered.json \
            --container "$ECS_API_CONTAINER_NAME" \
            --image "$IMAGE_URI"
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/api-task-definition-rendered.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Register worker task definition revision
        id: worker-task
        env:
          IMAGE_URI: ${{ needs.build-and-push.outputs.image_uri }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_WORKER_TASK_DEFINITION" \
            --query taskDefinition > /tmp/worker-task-definition.json
          python scripts/render_ecs_task_definition.py \
            --input /tmp/worker-task-definition.json \
            --output /tmp/worker-task-definition-rendered.json \
            --container "$ECS_WORKER_CONTAINER_NAME" \
            --image "$IMAGE_URI"
          TASK_DEFINITION_ARN="$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/worker-task-definition-rendered.json \
            --query taskDefinition.taskDefinitionArn \
            --output text)"
          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Run migration one-off task
        env:
          API_TASK_DEFINITION_ARN: ${{ steps.api-task.outputs.task_definition_arn }}
        run: |
          NETWORK_CONFIGURATION="$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_API_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)"
          MIGRATION_OVERRIDES="$(jq -cn --arg name "$ECS_API_CONTAINER_NAME" \
            '{containerOverrides:[{name:$name,command:["sh","-c","alembic upgrade head && python scripts/check_migrations.py"]}]}')"
          TASK_ARN="$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$API_TASK_DEFINITION_ARN" \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides "$MIGRATION_OVERRIDES" \
            --started-by github-actions-migration \
            --query 'tasks[0].taskArn' \
            --output text)"
          if [ "$TASK_ARN" = "None" ] || [ -z "$TASK_ARN" ]; then
            echo "migration task did not start"
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
          EXIT_CODE="$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='${ECS_API_CONTAINER_NAME}'].exitCode | [0]" \
            --output text)"
          if [ "$EXIT_CODE" != "0" ]; then
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
            exit 1
          fi

      - name: Deploy API service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_API_SERVICE" \
            --task-definition "${{ steps.api-task.outputs.task_definition_arn }}"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_API_SERVICE"

      - name: Deploy worker service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_WORKER_SERVICE" \
            --task-definition "${{ steps.worker-task.outputs.task_definition_arn }}"
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_WORKER_SERVICE"

      - name: Production smoke
        env:
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          uv run --extra dev python scripts/smoke_prod.py \
            --base-url "$API_BASE_URL" \
            --email "$SMOKE_EMAIL" \
            --password "$SMOKE_PASSWORD" \
            --query "What does this tiny service evidence say?"
