name: Validate and Manually Deploy Azure

on:
  push:
    branches:
      - core
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/deploy. Defaults to commit SHA."
        required: false
      deploy_collector:
        description: "Enable the in-Core Collector daemon with configured project/token/repository variables."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-demo-deploy
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
  ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}

jobs:
  core-tests:
    name: Core tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incidentops
          POSTGRES_PASSWORD: incidentops
          POSTGRES_DB: incidentops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    env:
      APP_ENV: local
      DB_CREATE_ALL: "false"
      DB_REQUIRE_MIGRATIONS: "true"
      DATABASE_URL: postgresql+asyncpg://incidentops:incidentops@127.0.0.1:5432/incidentops
      REDIS_URL: redis://127.0.0.1:6379/0
      RETRIEVAL_BACKEND: qdrant
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: incidentops_chunks_ci
      VECTOR_INDEX_VERSION: current
      JWT_SECRET: incidentops-local-jwt-secret-change-me
      ALLOW_LOCAL_SEED_ADMIN: "true"
      DEMO_MODE_PUBLIC: "false"
      ALLOW_DEMO_PROJECT_BYPASS: "true"
      RATE_LIMIT_BACKEND: memory
      WORKER_MODE: inline
      JOB_QUEUE_BACKEND: inline
      METRICS_BACKEND: memory
      METRICS_PUBLIC: "false"
      LOCAL_INGEST_ENABLED: "true"
      LOCAL_INGEST_ALLOWED_ROOTS: ${{ github.workspace }},/tmp
      EVAL_CASES_ALLOWED_ROOTS: ${{ github.workspace }},/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev alembic upgrade head
      - name: Bootstrap local CI admin
        run: uv run --extra dev python -m incidentops.security.bootstrap_admin --email admin@incidentops.local --password incidentops
      - name: Start API for integration tests
        run: |
          uv run --extra dev uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo "$!" > api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start."
          cat api.log
          exit 1
      - run: uv run --extra dev python -m pytest tests/unit tests/integration -q
      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" >/dev/null 2>&1 || true
          fi

  deploy:
    name: Build, deploy, migrate, and smoke Azure
    runs-on: ubuntu-latest
    needs: core-tests
    if: github.event_name == 'workflow_dispatch'
    environment: azure-demo
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: Ops-Incident-Core

      - name: Validate Azure login secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          test -n "$AZURE_CLIENT_ID" || missing+=("AZURE_CLIENT_ID")
          test -n "$AZURE_TENANT_ID" || missing+=("AZURE_TENANT_ID")
          test -n "$AZURE_SUBSCRIPTION_ID" || missing+=("AZURE_SUBSCRIPTION_ID")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Azure OIDC secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure infrastructure template
        working-directory: Ops-Incident-Core
        run: az bicep build --file infra/azure/main.bicep --stdout >/dev/null

      - name: Validate required variables
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || { echo "AZURE_RESOURCE_GROUP variable is required"; exit 1; }
          test -n "$AZURE_LOCATION" || { echo "AZURE_LOCATION variable is required"; exit 1; }
          test -n "$ACR_NAME" || { echo "ACR_NAME variable is required"; exit 1; }
          test -n "$NAME_PREFIX" || { echo "AZURE_NAME_PREFIX variable is required"; exit 1; }
          test -n "$ENVIRONMENT_NAME" || { echo "AZURE_ENVIRONMENT_NAME variable is required"; exit 1; }
          test -n "$CORS_ORIGINS" || { echo "CORS_ORIGINS variable is required"; exit 1; }
          test -n "${{ secrets.POSTGRES_PASSWORD }}" || { echo "POSTGRES_PASSWORD secret is required"; exit 1; }
          test -n "${{ secrets.JWT_SECRET }}" || { echo "JWT_SECRET secret is required"; exit 1; }
          test -n "${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}" || { echo "BOOTSTRAP_ADMIN_EMAIL secret is required"; exit 1; }
          test -n "${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}" || { echo "BOOTSTRAP_ADMIN_PASSWORD secret is required"; exit 1; }
          test -n "${{ vars.AZURE_OPENAI_ENDPOINT }}" || { echo "AZURE_OPENAI_ENDPOINT variable is required"; exit 1; }
          test -n "${{ secrets.AZURE_OPENAI_API_KEY }}" || { echo "AZURE_OPENAI_API_KEY secret is required"; exit 1; }
          test -n "${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}" || { echo "AZURE_OPENAI_CHAT_DEPLOYMENT variable is required"; exit 1; }
          test -n "${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}" || { echo "AZURE_OPENAI_EMBEDDING_DEPLOYMENT variable is required"; exit 1; }
          test -n "${{ vars.QDRANT_URL }}" || { echo "QDRANT_URL variable is required"; exit 1; }
          test -n "${{ secrets.QDRANT_API_KEY }}" || { echo "QDRANT_API_KEY secret is required"; exit 1; }

      - name: Build and push images
        working-directory: Ops-Incident-Core
        env:
          BUILD_FRONTEND: "false"
        run: scripts/azure_build_push_images.sh

      - name: Deploy Azure resources
        working-directory: Ops-Incident-Core
        env:
          DEPLOY_FRONTEND: "false"
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          INCIDENTOPS_TOKEN: ${{ inputs.deploy_collector && secrets.INCIDENTOPS_TOKEN || '' }}
          INCIDENTOPS_PROJECT_ID: ${{ inputs.deploy_collector && vars.INCIDENTOPS_PROJECT_ID || '' }}
          COLLECTOR_REPO_URL: ${{ inputs.deploy_collector && vars.COLLECTOR_REPO_URL || '' }}
          INCIDENTOPS_MCP_TOKEN: ${{ secrets.INCIDENTOPS_MCP_TOKEN || '' }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-10-21' }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'incidentops_chunks' }}
          EMBEDDING_DIMENSION: ${{ vars.EMBEDDING_DIMENSION || '1024' }}
        run: scripts/azure_deploy.sh

      - name: Run migrations
        working-directory: Ops-Incident-Core
        run: scripts/azure_run_migrations.sh

      - name: Bootstrap admin
        working-directory: Ops-Incident-Core
        run: scripts/azure_bootstrap_admin.sh

      - name: Azure smoke
        working-directory: Ops-Incident-Core
        env:
          FRONTEND_URL: ""
          SMOKE_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: scripts/azure_smoke.sh
