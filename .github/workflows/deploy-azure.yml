name: Validate and Manually Deploy Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to build/deploy. Defaults to commit SHA."
        required: false
      deploy_collector:
        description: "Enable the in-Core Collector daemon with configured project/token/repository variables."
        required: false
        type: boolean
        default: false
      run_mcp_smoke:
        description: "Run the private MCP probe from inside Azure after deployment."
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-demo-deploy
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
  ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME }}
  CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}

jobs:
  core-tests:
    name: Core tests (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: inline
            worker_mode: inline
            job_queue_backend: inline
            rate_limit_backend: memory
            # Everything runs; test_queue_mode.py skips itself outside queue mode.
            deselect: ""
          - mode: queue
            worker_mode: queue
            job_queue_backend: redis
            rate_limit_backend: redis
            # These assert the synchronous inline response. test_queue_mode.py
            # covers the same paths by polling.
            deselect: >-
              --deselect tests/integration/test_api.py::TestEvalEndpoint::test_eval_accepts_custom_cases_path
              --deselect tests/integration/test_operations_api.py::test_observer_and_logging_runs_are_project_scoped_and_idempotent
              --deselect tests/integration/test_security_api.py::test_investigator_cannot_approve_but_approver_can
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: incidentops
          POSTGRES_PASSWORD: incidentops
          POSTGRES_DB: incidentops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports:
          - 6333:6333
    env:
      APP_ENV: local
      DB_CREATE_ALL: "false"
      DB_REQUIRE_MIGRATIONS: "true"
      DATABASE_URL: postgresql+asyncpg://incidentops:incidentops@127.0.0.1:5432/incidentops
      REDIS_URL: redis://127.0.0.1:6379/0
      RETRIEVAL_BACKEND: qdrant
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: incidentops_chunks_ci
      VECTOR_INDEX_VERSION: current
      JWT_SECRET: incidentops-local-jwt-secret-change-me
      ALLOW_LOCAL_SEED_ADMIN: "true"
      DEMO_MODE_PUBLIC: "false"
      ALLOW_DEMO_PROJECT_BYPASS: "true"
      RATE_LIMIT_BACKEND: ${{ matrix.rate_limit_backend }}
      USER_REQUEST_LIMIT: 1000
      LOGIN_EMAIL_REQUEST_LIMIT: 1000
      PROJECT_INGESTION_LIMIT: 1000
      WORKER_MODE: ${{ matrix.worker_mode }}
      JOB_QUEUE_BACKEND: ${{ matrix.job_queue_backend }}
      METRICS_BACKEND: memory
      METRICS_PUBLIC: "false"
      LOCAL_INGEST_ENABLED: "true"
      LOCAL_INGEST_ALLOWED_ROOTS: ${{ github.workspace }},/tmp
      EVAL_CASES_ALLOWED_ROOTS: ${{ github.workspace }},/tmp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra dev ruff check .
      - run: uv run --extra dev alembic upgrade head
      - run: uv run --extra dev python scripts/check_migrations.py
      - name: Bootstrap local CI admin
        run: uv run --extra dev python -m incidentops.security.bootstrap_admin --email admin@incidentops.local --password incidentops
      - name: Start API for integration tests
        run: |
          uv run --extra dev uvicorn apps.api.main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          echo "$!" > api.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start."
          cat api.log
          exit 1
      - name: Start worker
        if: matrix.mode == 'queue'
        run: |
          uv run --extra dev python -m incidentops.worker > worker.log 2>&1 &
          echo "$!" > worker.pid
      - name: Run tests
        env:
          PYTEST_DESELECT: ${{ matrix.deselect }}
        # Word splitting on PYTEST_DESELECT is intended: it holds pytest flags.
        run: uv run --extra dev python -m pytest tests/unit tests/integration -q $PYTEST_DESELECT
      - name: Show service logs on failure
        if: failure()
        run: |
          tail -n 200 api.log || true
          tail -n 200 worker.log || true
      - name: Stop API and worker
        if: always()
        run: |
          for pid_file in api.pid worker.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" >/dev/null 2>&1 || true
            fi
          done

  frontend-tests:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run typecheck
      - working-directory: apps/web
        run: npm run build

  deploy:
    name: Build, deploy, migrate, and smoke Azure
    runs-on: ubuntu-latest
    needs: [core-tests, frontend-tests]
    environment: azure-demo
    env:
      CLOUD_PROVIDER: ${{ vars.CLOUD_PROVIDER || 'nvidia' }}
    steps:
      - name: Checkout Core
        uses: actions/checkout@v4
        with:
          path: Ops-Incident-Core

      - name: Validate Azure login secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=()
          test -n "$AZURE_CLIENT_ID" || missing+=("AZURE_CLIENT_ID")
          test -n "$AZURE_TENANT_ID" || missing+=("AZURE_TENANT_ID")
          test -n "$AZURE_SUBSCRIPTION_ID" || missing+=("AZURE_SUBSCRIPTION_ID")
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required Azure OIDC secret(s): %s\n' "${missing[*]}" >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Azure infrastructure template
        working-directory: Ops-Incident-Core
        run: |
          az bicep build --file infra/azure/main.bicep --stdout >/dev/null

      - name: Validate required variables
        env:
          EMBEDDING_MODEL_CHECK: ${{ vars.EMBEDDING_MODEL || 'nvidia/nemotron-3-embed-1b' }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT_CHECK: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT || '' }}
          AZURE_OPENAI_ENDPOINT_CHECK: ${{ vars.AZURE_OPENAI_ENDPOINT || '' }}
          AZURE_OPENAI_CHAT_DEPLOYMENT_CHECK: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT || '' }}
          AZURE_OPENAI_API_KEY_CHECK: ${{ secrets.AZURE_OPENAI_API_KEY || '' }}
          NVIDIA_API_KEY_CHECK: ${{ secrets.NVIDIA_API_KEY || '' }}
          POSTGRES_PASSWORD_CHECK: ${{ secrets.POSTGRES_PASSWORD || '' }}
          JWT_SECRET_CHECK: ${{ secrets.JWT_SECRET || '' }}
          BOOTSTRAP_ADMIN_EMAIL_CHECK: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL || '' }}
          BOOTSTRAP_ADMIN_PASSWORD_CHECK: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD || '' }}
          INCIDENTOPS_MCP_TOKEN_CHECK: ${{ secrets.INCIDENTOPS_MCP_TOKEN || '' }}
          MCP_INBOUND_TOKEN_CHECK: ${{ secrets.MCP_INBOUND_TOKEN || '' }}
          QDRANT_URL_CHECK: ${{ vars.QDRANT_URL || '' }}
          QDRANT_API_KEY_CHECK: ${{ secrets.QDRANT_API_KEY || '' }}
        run: |
          test -n "$AZURE_RESOURCE_GROUP" || { echo "AZURE_RESOURCE_GROUP variable is required"; exit 1; }
          test -n "$AZURE_LOCATION" || { echo "AZURE_LOCATION variable is required"; exit 1; }
          test -n "$ACR_NAME" || { echo "ACR_NAME variable is required"; exit 1; }
          test -n "$NAME_PREFIX" || { echo "AZURE_NAME_PREFIX variable is required"; exit 1; }
          test -n "$ENVIRONMENT_NAME" || { echo "AZURE_ENVIRONMENT_NAME variable is required"; exit 1; }
          test -n "$CORS_ORIGINS" || { echo "CORS_ORIGINS variable is required"; exit 1; }
          test -n "$POSTGRES_PASSWORD_CHECK" || { echo "POSTGRES_PASSWORD secret is required"; exit 1; }
          test -n "$JWT_SECRET_CHECK" || { echo "JWT_SECRET secret is required"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_EMAIL_CHECK" || { echo "BOOTSTRAP_ADMIN_EMAIL secret is required"; exit 1; }
          test -n "$BOOTSTRAP_ADMIN_PASSWORD_CHECK" || { echo "BOOTSTRAP_ADMIN_PASSWORD secret is required"; exit 1; }
          test -n "$INCIDENTOPS_MCP_TOKEN_CHECK" || { echo "INCIDENTOPS_MCP_TOKEN secret is required"; exit 1; }
          test -n "$MCP_INBOUND_TOKEN_CHECK" || { echo "MCP_INBOUND_TOKEN secret is required"; exit 1; }
          if [[ "$CLOUD_PROVIDER" == "azure" ]]; then
            test -n "$AZURE_OPENAI_ENDPOINT_CHECK" || { echo "AZURE_OPENAI_ENDPOINT variable is required for CLOUD_PROVIDER=azure"; exit 1; }
            test -n "$AZURE_OPENAI_API_KEY_CHECK" || { echo "AZURE_OPENAI_API_KEY secret is required for CLOUD_PROVIDER=azure"; exit 1; }
            test -n "$AZURE_OPENAI_CHAT_DEPLOYMENT_CHECK" || { echo "AZURE_OPENAI_CHAT_DEPLOYMENT variable is required for CLOUD_PROVIDER=azure"; exit 1; }
          fi
          if [[ "$CLOUD_PROVIDER" == "nvidia" ]]; then
            test -n "$NVIDIA_API_KEY_CHECK" || { echo "NVIDIA_API_KEY secret is required for CLOUD_PROVIDER=nvidia"; exit 1; }
          fi
          if [[ "$EMBEDDING_MODEL_CHECK" == azure-openai* ]]; then
            test -n "$AZURE_OPENAI_EMBEDDING_DEPLOYMENT_CHECK" || { echo "AZURE_OPENAI_EMBEDDING_DEPLOYMENT variable is required for Azure OpenAI embeddings"; exit 1; }
          fi
          if [[ "$EMBEDDING_MODEL_CHECK" == nvidia* ]]; then
            test -n "$NVIDIA_API_KEY_CHECK" || { echo "NVIDIA_API_KEY secret is required for Nemotron embeddings"; exit 1; }
          fi
          test -n "$QDRANT_URL_CHECK" || { echo "QDRANT_URL variable is required"; exit 1; }
          test -n "$QDRANT_API_KEY_CHECK" || { echo "QDRANT_API_KEY secret is required"; exit 1; }

      - name: Build and push images
        working-directory: Ops-Incident-Core
        env:
          BUILD_FRONTEND: "false"
        run: scripts/azure_build_push_images.sh

      - name: Deploy Azure resources
        working-directory: Ops-Incident-Core
        env:
          DEPLOY_FRONTEND: "false"
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          INCIDENTOPS_TOKEN: ${{ inputs.deploy_collector && secrets.INCIDENTOPS_TOKEN || '' }}
          INCIDENTOPS_PROJECT_ID: ${{ inputs.deploy_collector && vars.INCIDENTOPS_PROJECT_ID || '' }}
          COLLECTOR_REPO_URL: ${{ inputs.deploy_collector && vars.COLLECTOR_REPO_URL || '' }}
          INCIDENTOPS_MCP_TOKEN: ${{ secrets.INCIDENTOPS_MCP_TOKEN || '' }}
          MCP_INBOUND_TOKEN: ${{ secrets.MCP_INBOUND_TOKEN || '' }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN || '' }}
          TRUSTED_PROXIES: ${{ vars.TRUSTED_PROXIES || '' }}
          ENABLE_PRIVATE_NETWORKING: ${{ vars.ENABLE_PRIVATE_NETWORKING || 'false' }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_API_VERSION: ${{ vars.AZURE_OPENAI_API_VERSION || '2024-10-21' }}
          AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
          AZURE_OPENAI_EMBEDDING_DEPLOYMENT: ${{ vars.AZURE_OPENAI_EMBEDDING_DEPLOYMENT }}
          QDRANT_URL: ${{ vars.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          QDRANT_COLLECTION: ${{ vars.QDRANT_COLLECTION || 'incidentops_chunks_nemotron_3_embed_1b' }}
          EMBEDDING_DIMENSION: ${{ vars.EMBEDDING_DIMENSION || '2048' }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || 'nvidia/nemotron-3-embed-1b' }}
          VECTOR_INDEX_VERSION: ${{ vars.VECTOR_INDEX_VERSION || 'nemotron-3-embed-1b-2048' }}
          HF_API_TOKEN: ${{ secrets.HF_API_TOKEN || '' }}
          HF_EMBEDDING_MODEL: ${{ vars.HF_EMBEDDING_MODEL || 'thenlper/gte-large' }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY || '' }}
          NVIDIA_EMBEDDING_MODEL: ${{ vars.NVIDIA_EMBEDDING_MODEL || 'nvidia/nemotron-3-embed-1b' }}
          NVIDIA_EMBEDDING_ENDPOINT: ${{ vars.NVIDIA_EMBEDDING_ENDPOINT || 'https://integrate.api.nvidia.com/v1/embeddings' }}
          NVIDIA_CHAT_MODEL: ${{ vars.NVIDIA_CHAT_MODEL || 'nvidia/nemotron-3-super-120b-a12b' }}
          NVIDIA_CHAT_ENDPOINT: ${{ vars.NVIDIA_CHAT_ENDPOINT || 'https://integrate.api.nvidia.com/v1' }}
        run: scripts/azure_deploy.sh

      - name: Run migrations
        working-directory: Ops-Incident-Core
        run: scripts/azure_run_migrations.sh

      - name: Bootstrap admin
        working-directory: Ops-Incident-Core
        run: scripts/azure_bootstrap_admin.sh

      - name: Azure smoke
        working-directory: Ops-Incident-Core
        env:
          FRONTEND_URL: ${{ vars.VERCEL_FRONTEND_URL || '' }}
          SMOKE_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          VERIFY_COLLECTOR: ${{ inputs.deploy_collector && 'true' || 'false' }}
        run: scripts/azure_smoke.sh

      - name: Cloud session telemetry smoke
        working-directory: Ops-Incident-Core
        env:
          SMOKE_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          python3 -m venv /tmp/incidentops-smoke-venv
          /tmp/incidentops-smoke-venv/bin/pip install --quiet -e .
          API_URL="https://$(az containerapp show --resource-group "$AZURE_RESOURCE_GROUP" --name "${NAME_PREFIX}-core-api" --query 'properties.configuration.ingress.fqdn' --output tsv --only-show-errors)"
          set +e
          /tmp/incidentops-smoke-venv/bin/python scripts/smoke_prod.py \
            --base-url "$API_URL" \
            --email "$SMOKE_EMAIL" \
            --password "$SMOKE_PASSWORD" \
            --query "Which evidence shows the service deployment and latency behavior?" \
            --use-collector-batch true \
            --timeout-seconds 240 \
            --report-path /tmp/incidentops-live-session-telemetry.json
          smoke_status=$?
          set -e
          echo "Sanitized cloud session telemetry:"
          if [[ -f /tmp/incidentops-live-session-telemetry.json ]]; then
            cat /tmp/incidentops-live-session-telemetry.json
          else
            echo '{"failure":"smoke_did_not_write_report"}'
          fi
          exit "$smoke_status"

      - name: Private MCP smoke
        if: inputs.run_mcp_smoke
        working-directory: Ops-Incident-Core
        env:
          PROJECT_ID: ${{ vars.INCIDENTOPS_PROJECT_ID }}
          SEARCH_QUERY: "Where is the primary application entrypoint implemented?"
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
        run: scripts/azure_mcp_smoke.sh
