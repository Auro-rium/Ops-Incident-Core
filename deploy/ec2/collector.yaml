api:
  base_url: "http://api:8000"
  token_env: "INCIDENTOPS_TOKEN"
  timeout_seconds: 30
  verify_tls: false
  auth_required: true

project:
  id: "runtime-project-id"

collector:
  id: "ec2-demo-collector"
  name: "ec2-demo-collector"
  mode: "daemon"
  environment: "ec2-demo"

state:
  sqlite_path: "/var/lib/opsincident-collector/state.sqlite"

sync:
  batch_size: 50
  max_file_size_mb: 10
  incremental: true
  dry_run: false
  compression: false
  retry_count: 5
  retry_backoff_seconds: 5
  retry_due_on_start: true

security:
  redact_secrets: true
  require_confirmation_for_upload: true
  allow_paths:
    - "/app/tests/fixtures/basic_project"
  deny_patterns:
    - ".env"
    - ".env.*"
    - "*.pem"
    - "*.key"
    - "id_rsa"
    - "id_ed25519"
    - "*.p12"
    - "*.pfx"
    - "*.crt"
    - "*.cer"
    - ".git/**"
    - "node_modules/**"
    - ".venv/**"
    - "venv/**"
    - "__pycache__/**"
    - "dist/**"
    - "build/**"
    - "target/**"
    - ".next/**"
    - ".pytest_cache/**"
    - ".mypy_cache/**"
    - ".ruff_cache/**"
    - "*.sqlite"
    - "*.db"
    - "*.parquet"
    - "*.zip"
    - "*.tar"
    - "*.gz"
    - "*.7z"
    - "*.png"
    - "*.jpg"
    - "*.jpeg"
    - "*.mp4"
    - "*.mov"
    - "*.pdf"

daemon:
  enabled: true
  interval_seconds: 300
  jitter_seconds: 30
  export_target: "api"
  health_enabled: true
  health_host: "0.0.0.0"
  health_port: 8686
  metrics_enabled: true
  metrics_host: "0.0.0.0"
  metrics_port: 8687
  allow_unattended_upload: true
  source_name: "ec2-demo-fixture"
  source_type: "filesystem"
  max_depth: 8

sources:
  - name: "ec2-demo-fixture"
    type: "filesystem"
    path: "/app/tests/fixtures/basic_project"
