services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: incidentops
      POSTGRES_DB: incidentops
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine

  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://incidentops:incidentops@postgres:5432/incidentops}
      APP_ENV: ${APP_ENV:-local}
      DB_CREATE_ALL: ${DB_CREATE_ALL:-false}
      DB_REQUIRE_MIGRATIONS: ${DB_REQUIRE_MIGRATIONS:-true}
      JWT_SECRET: ${JWT_SECRET:-incidentops-local-jwt-secret-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ISSUER: ${JWT_ISSUER:-incidentops}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-incidentops-api}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      ALLOW_LOCAL_SEED_ADMIN: ${ALLOW_LOCAL_SEED_ADMIN:-true}
      EMBEDDING_MODEL: local-hash-v1
      EMBEDDING_DIM: "384"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      DEMO_MODE_PUBLIC: ${DEMO_MODE_PUBLIC:-false}
      ALLOW_DEMO_PROJECT_BYPASS: ${ALLOW_DEMO_PROJECT_BYPASS:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      WORKER_MODE: ${WORKER_MODE:-inline}
      JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-inline}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WORKFLOW_NODE_TIMEOUT_SECONDS: ${WORKFLOW_NODE_TIMEOUT_SECONDS:-60}
      WORKFLOW_MAX_RETRIES: ${WORKFLOW_MAX_RETRIES:-1}
      WORKFLOW_RUN_TIMEOUT_SECONDS: ${WORKFLOW_RUN_TIMEOUT_SECONDS:-300}
      EVAL_RUN_TIMEOUT_SECONDS: ${EVAL_RUN_TIMEOUT_SECONDS:-600}
      JOB_POLL_INTERVAL_SECONDS: ${JOB_POLL_INTERVAL_SECONDS:-2}
      ENABLE_OTEL: ${ENABLE_OTEL:-false}
      METRICS_BACKEND: ${METRICS_BACKEND:-memory}
      MAX_DOCUMENTS_PER_BATCH: ${MAX_DOCUMENTS_PER_BATCH:-100}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-2000000}
      MAX_BATCH_BYTES: ${MAX_BATCH_BYTES:-10000000}
      MAX_CHUNKS_PER_DOCUMENT: ${MAX_CHUNKS_PER_DOCUMENT:-500}
      MAX_METADATA_BYTES: ${MAX_METADATA_BYTES:-64000}
      MAX_EXTERNAL_ID_LENGTH: ${MAX_EXTERNAL_ID_LENGTH:-1024}
      MAX_PATH_LENGTH: ${MAX_PATH_LENGTH:-2048}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      - ${INGEST_ROOT:-.}:${INGEST_CONTAINER_ROOT:-/workspace}:ro

  core-worker:
    build: .
    command: python -m incidentops.worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://incidentops:incidentops@postgres:5432/incidentops}
      APP_ENV: ${APP_ENV:-local}
      DB_CREATE_ALL: ${DB_CREATE_ALL:-false}
      DB_REQUIRE_MIGRATIONS: ${DB_REQUIRE_MIGRATIONS:-true}
      JWT_SECRET: ${JWT_SECRET:-incidentops-local-jwt-secret-change-me}
      ALLOW_LOCAL_SEED_ADMIN: ${ALLOW_LOCAL_SEED_ADMIN:-true}
      DEMO_MODE_PUBLIC: ${DEMO_MODE_PUBLIC:-false}
      ALLOW_DEMO_PROJECT_BYPASS: ${ALLOW_DEMO_PROJECT_BYPASS:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-memory}
      WORKER_MODE: ${WORKER_MODE:-inline}
      JOB_QUEUE_BACKEND: ${JOB_QUEUE_BACKEND:-inline}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      EMBEDDING_MODEL: local-hash-v1
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      ENABLE_OTEL: ${ENABLE_OTEL:-false}
      METRICS_BACKEND: ${METRICS_BACKEND:-memory}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - model_cache:/root/.cache

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  model_cache:
