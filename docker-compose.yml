services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: incidentops
      POSTGRES_PASSWORD: incidentops
      POSTGRES_DB: incidentops
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentops"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://incidentops:incidentops@postgres:5432/incidentops
      APP_ENV: ${APP_ENV:-local}
      DB_CREATE_ALL: ${DB_CREATE_ALL:-false}
      DB_REQUIRE_MIGRATIONS: ${DB_REQUIRE_MIGRATIONS:-true}
      EMBEDDING_MODEL: local-hash-v1
      EMBEDDING_DIM: "384"
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      RERANKER_MODEL: ${RERANKER_MODEL:-}
      DEMO_MODE_PUBLIC: ${DEMO_MODE_PUBLIC:-false}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - model_cache:/root/.cache
      - ${INGEST_ROOT:-.}:/workspace:ro

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://127.0.0.1:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  model_cache:
