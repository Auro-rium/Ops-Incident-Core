services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-incidentops}
    volumes:
      - ec2_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-incidentops} -d $${POSTGRES_DB:-incidentops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - incidentops_private

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ec2_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - incidentops_private

  migrate:
    build:
      context: .
    profiles: ["tools"]
    restart: "no"
    env_file:
      - ${EC2_DEMO_ENV_FILE:-deploy/ec2/.env.demo}
    command: ["sh", "-c", "alembic upgrade head && python scripts/check_migrations.py"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - incidentops_private

  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${EC2_DEMO_ENV_FILE:-deploy/ec2/.env.demo}
    command:
      [
        "sh",
        "-c",
        "python scripts/check_migrations.py && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - incidentops_private

  core-worker:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${EC2_DEMO_ENV_FILE:-deploy/ec2/.env.demo}
    command: ["python", "-m", "incidentops.worker"]
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - incidentops_private

  admin-bootstrap:
    build:
      context: .
    profiles: ["tools"]
    restart: "no"
    env_file:
      - ${EC2_DEMO_ENV_FILE:-deploy/ec2/.env.demo}
    command: ["python", "-m", "incidentops.security.bootstrap_admin"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - incidentops_private

  frontend:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - incidentops_private

  collector:
    build:
      context: ${COLLECTOR_REPO_PATH:-../OpsIncident-Collector}
    restart: unless-stopped
    env_file:
      - ${EC2_DEMO_ENV_FILE:-deploy/ec2/.env.demo}
      - ${EC2_DEMO_RUNTIME_ENV_FILE:-deploy/ec2/.env.runtime}
    environment:
      INCIDENTOPS_API_URL: http://api:8000
      INCIDENTOPS_TOKEN: ${INCIDENTOPS_TOKEN:-}
      PROJECT_ID: ${DEMO_PROJECT_ID:-}
      INCIDENTOPS_PROJECT_ID: ${DEMO_PROJECT_ID:-}
      SOURCE_NAME: ${COLLECTOR_SOURCE_NAME:-ec2-demo-fixture}
      SOURCE_TYPE: filesystem
      COLLECTOR_ENVIRONMENT: ec2-demo
      COLLECTOR_CONFIG: /etc/opsincident-collector/collector.yaml
      INCIDENTOPS_EDGE_STATE: /var/lib/opsincident-collector/state.sqlite
    command: ["daemon", "run", "--config", "/etc/opsincident-collector/collector.yaml"]
    volumes:
      - ./deploy/ec2/collector.yaml:/etc/opsincident-collector/collector.yaml:ro
      - ec2_collectordata:/var/lib/opsincident-collector
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "opsincident-collector",
          "daemon",
          "health",
          "--host",
          "127.0.0.1",
          "--port",
          "8686",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - incidentops_private

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/ec2/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/ec2/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - incidentops_private

volumes:
  ec2_pgdata:
  ec2_redisdata:
  ec2_collectordata:

networks:
  incidentops_private:
    driver: bridge
