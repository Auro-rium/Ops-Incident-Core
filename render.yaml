# Free Render deployment. Every resource is on a free plan; do not change a plan
# without checking its cost. See "Render Free Deployment" in technical.md for limits.
databases:
  - name: incidentops-db
    plan: free
    region: oregon
    databaseName: incidentops
    user: incidentops
    ipAllowList: []

services:
  - type: keyvalue
    name: incidentops-redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: incidentops-core
    runtime: docker
    plan: free
    region: oregon
    branch: fix/review-findings
    autoDeploy: false
    dockerfilePath: docker/render.Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: incidentops-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@incidentops.local
      # APP_ENV=production demands paid model providers, so the safety settings it
      # enforces are set explicitly here.
      - key: APP_ENV
        value: local
      - key: ALLOW_LOCAL_SEED_ADMIN
        value: "false"
      - key: DEMO_MODE_PUBLIC
        value: "false"
      - key: ALLOW_DEMO_PROJECT_BYPASS
        value: "false"
      - key: LOCAL_INGEST_ENABLED
        value: "false"
      - key: ALLOW_LOCAL_MODEL_LOADING
        value: "false"
      - key: DB_CREATE_ALL
        value: "false"
      - key: DB_REQUIRE_MIGRATIONS
        value: "true"
      - key: METRICS_PUBLIC
        value: "false"
      - key: CORS_ALLOW_ORIGINS
        value: ""
      - key: TRUSTED_PROXIES
        value: 10.0.0.0/8
      - key: WORKER_MODE
        value: queue
      - key: JOB_QUEUE_BACKEND
        value: redis
      - key: RATE_LIMIT_BACKEND
        value: redis
      - key: RAG_ASYNC_INDEXING
        value: "true"
      - key: RETRIEVAL_BACKEND
        value: qdrant
      - key: QDRANT_COLLECTION
        value: incidentops_chunks
      - key: VECTOR_INDEX_VERSION
        value: current
      - key: EMBEDDING_MODEL
        value: local-hash-v1
