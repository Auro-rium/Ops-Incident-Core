<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-label="Reference production topology">
  <style>
    .title { font: 700 26px sans-serif; fill: #0f172a; }
    .node { fill: #eef2ff; stroke: #334155; stroke-width: 2; rx: 10; ry: 10; }
    .store { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; rx: 28; ry: 28; }
    .text { font: 600 15px sans-serif; fill: #0f172a; }
    .sub { font: 500 13px sans-serif; fill: #334155; }
    .line { stroke: #334155; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#334155" />
    </marker>
  </defs>

  <text x="30" y="45" class="title">Reference Production Topology</text>

  <rect x="60" y="110" width="180" height="70" class="node"/>
  <text x="93" y="150" class="text">Clients / UI</text>

  <rect x="300" y="110" width="200" height="70" class="node"/>
  <text x="340" y="150" class="text">Load Balancer</text>

  <rect x="580" y="70" width="190" height="60" class="node"/>
  <text x="620" y="107" class="text">API Replica 1</text>

  <rect x="580" y="145" width="190" height="60" class="node"/>
  <text x="620" y="182" class="text">API Replica 2</text>

  <rect x="580" y="220" width="190" height="60" class="node"/>
  <text x="620" y="257" class="text">API Replica N</text>

  <ellipse cx="880" cy="130" rx="145" ry="46" class="store"/>
  <text x="817" y="125" class="text">Postgres</text>
  <text x="802" y="145" class="sub">with pgvector</text>

  <ellipse cx="880" cy="235" rx="145" ry="46" class="store"/>
  <text x="850" y="240" class="text">Redis</text>

  <rect x="580" y="350" width="190" height="60" class="node"/>
  <text x="610" y="387" class="text">Worker Replica 1</text>

  <rect x="580" y="425" width="190" height="60" class="node"/>
  <text x="610" y="462" class="text">Worker Replica 2</text>

  <rect x="580" y="500" width="190" height="60" class="node"/>
  <text x="610" y="537" class="text">Worker Replica N</text>

  <ellipse cx="880" cy="445" rx="175" ry="56" class="store"/>
  <text x="754" y="438" class="text">Metrics / Tracing Backend</text>
  <text x="775" y="458" class="sub">(Prometheus + OTLP sink)</text>

  <path d="M240 145 L300 145" class="line"/>
  <path d="M500 145 L580 100" class="line"/>
  <path d="M500 145 L580 175" class="line"/>
  <path d="M500 145 L580 250" class="line"/>

  <path d="M770 100 L760 100 Q820 100 760 235" class="line"/>
  <path d="M770 175 L830 235" class="line"/>
  <path d="M770 250 L840 235" class="line"/>

  <path d="M770 100 L820 130" class="line"/>
  <path d="M770 175 L820 130" class="line"/>
  <path d="M770 250 L820 130" class="line"/>

  <path d="M880 281 L770 380" class="line"/>
  <path d="M880 281 L770 455" class="line"/>
  <path d="M880 281 L770 530" class="line"/>

  <path d="M770 380 L820 130" class="line"/>
  <path d="M770 455 L820 130" class="line"/>
  <path d="M770 530 L820 130" class="line"/>

  <path d="M770 380 L760 420" class="line"/>
  <path d="M770 455 L760 445" class="line"/>
  <path d="M770 530 L760 470" class="line"/>
  <path d="M770 100 L725 410" class="line"/>
  <path d="M770 175 L725 430" class="line"/>
  <path d="M770 250 L725 450" class="line"/>
</svg>
