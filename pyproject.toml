[project]
name = "incidentops-agent"
version = "0.1.0"
description = "Production-style RAG system for incident debugging and root-cause analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "pgvector>=0.3,<1",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "tiktoken>=0.7,<1",
    "python-dotenv>=1.0,<2",
    "PyJWT>=2.7,<3",
    "bcrypt>=4.1,<5",
    "redis>=5,<6",
    "opentelemetry-sdk>=1.27,<2",
    "mcp>=1.13,<2",
]

[project.optional-dependencies]
reranker = ["sentence-transformers>=3.0,<4"]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "httpx>=0.27,<1",
    "ruff>=0.4,<1",
]

[tool.setuptools.packages.find]
include = ["apps*", "incidentops*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
